[project]
name = "bee-call"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic[bedrock]==1.13.0",
    "boto3>=1.43.106",
    "cryptography>=50.0.2",
    "httpx[http2]>=0.28.1",
    "livekit-agents[aws,silero,turn-detector]==1.8.6",
    "livekit-plugins-elevenlabs==1.8.6",
    "livekit-plugins-noise-cancellation==0.3.2",
    "markdown-it-py>=4.2.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "regex>=2026.9.29",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
